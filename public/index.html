<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NoteKeep</title>
<meta name="theme-color" content="#2B2A28">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div id="app">

  <!-- Top bar -->
  <header class="topbar">
    <button class="icon-btn" id="menuBtn" title="Menu" aria-label="Menu">
      <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <div class="brand">
      <span class="brand-mark"></span>
      <span class="brand-name">NoteKeep</span>
    </div>
    <div class="searchwrap">
      <svg class="search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="searchInput" type="text" placeholder="Search your notes" autocomplete="off">
      <button class="icon-btn small hidden" id="clearSearchBtn" title="Clear search">
        <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <button class="icon-btn" id="syncBtn" title="Sync now">
      <svg id="syncIcon" viewBox="0 0 24 24"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0115-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 01-15 6.7L3 16"/></svg>
    </button>
    <button class="icon-btn" id="themeBtn" title="Toggle dark mode">
      <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z"/></svg>
    </button>
  </header>

  <div class="body-wrap">

    <!-- Sidebar -->
    <nav class="sidebar" id="sidebar">
      <button class="nav-item active" data-view="notes">
        <svg viewBox="0 0 24 24"><path d="M9 2h6a1 1 0 011 1v18l-4-3-4 3V3a1 1 0 011-1z"/></svg>
        <span>Notes</span>
      </button>
      <button class="nav-item" data-view="archive">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v11a1 1 0 001 1h12a1 1 0 001-1V8"/><path d="M10 13h4"/></svg>
        <span>Archive</span>
      </button>
      <button class="nav-item" data-view="trash">
        <svg viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13a1 1 0 001 1h8a1 1 0 001-1l1-13"/></svg>
        <span>Trash</span>
      </button>

      <div class="nav-divider"></div>
      <div class="nav-section-label">
        <span>Labels</span>
        <button class="icon-btn tiny" id="addLabelBtn" title="Create label">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
      <div id="labelList" class="label-list"></div>
      <div class="build-stamp" id="buildStamp"></div>
    </nav>

    <div class="sidebar-scrim" id="sidebarScrim"></div>

    <!-- Main -->
    <main class="main">

      <div class="composer-wrap">
        <div class="composer" id="composer">
          <input type="text" id="composerTitle" class="composer-title" placeholder="Title" />
          <textarea id="composerBody" class="composer-body" placeholder="Take a note…" rows="1"></textarea>
          <div id="composerChecklist" class="composer-checklist hidden"></div>
          <div class="composer-actions hidden" id="composerActions">
            <div class="composer-actions-left">
              <button class="icon-btn" id="composerPinBtn" title="Pin note">
                <svg viewBox="0 0 24 24"><path d="M12 2l1.8 5.6L19 9l-4 3.6.9 6.4L12 16l-3.9 3 .9-6.4L5 9l5.2-1.4z"/></svg>
              </button>
              <button class="icon-btn" id="composerChecklistBtn" title="New checklist">
                <svg viewBox="0 0 24 24"><path d="M4 6h4M4 12h4M4 18h4"/><rect x="10" y="4" width="10" height="4" rx="1"/><rect x="10" y="10" width="10" height="4" rx="1"/><rect x="10" y="16" width="10" height="4" rx="1"/></svg>
              </button>
              <button class="icon-btn popover-trigger" id="composerColorBtn" title="Background options">
                <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 100 20c1.5 0 2-1 2-2s-.5-1.5-.5-2 .5-1 1.5-1h1a5 5 0 005-5c0-5.5-4.5-10-9-10z"/><circle cx="7.5" cy="10.5" r="1.2"/><circle cx="12" cy="7.5" r="1.2"/><circle cx="16.5" cy="10.5" r="1.2"/></svg>
              </button>
              <button class="icon-btn popover-trigger" id="composerLabelBtn" title="Add label">
                <svg viewBox="0 0 24 24"><path d="M20.6 12.6L12 21.2 2.8 12 11.4 3.4 20.6 12.6z"/><circle cx="8.5" cy="8.5" r="1.3"/></svg>
              </button>
              <button class="icon-btn" id="composerArchiveBtn" title="Archive">
                <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v11a1 1 0 001 1h12a1 1 0 001-1V8"/><path d="M10 13h4"/></svg>
              </button>
            </div>
            <button class="text-btn" id="composerCloseBtn">Close</button>
          </div>
        </div>
      </div>

      <div class="view-heading" id="viewHeading" style="display:none;"></div>
      <div class="pinned-heading hidden" id="pinnedHeading">PINNED</div>
      <div class="notes-grid" id="pinnedGrid"></div>
      <div class="others-heading hidden" id="othersHeading">OTHERS</div>
      <div class="notes-grid" id="notesGrid"></div>

      <div class="empty-state hidden" id="emptyState">
        <svg viewBox="0 0 24 24"><path d="M9 2h6a1 1 0 011 1v18l-4-3-4 3V3a1 1 0 011-1z"/></svg>
        <p id="emptyStateText">Notes you add appear here</p>
      </div>
    </main>
  </div>
</div>

<!-- Note editor overlay -->
<div class="overlay hidden" id="editorOverlay">
  <div class="editor-scrim" id="editorScrim"></div>
  <div class="editor" id="editor">
    <input type="text" id="editorTitle" class="editor-title" placeholder="Title">
    <textarea id="editorBody" class="editor-body" placeholder="Take a note…"></textarea>
    <div id="editorChecklist" class="editor-checklist hidden"></div>
    <button class="text-btn add-item-btn hidden" id="addChecklistItemBtn">+ Add item</button>
    <div class="editor-labels" id="editorLabels"></div>
    <div class="editor-footer">
      <div class="editor-actions-left">
        <button class="icon-btn" id="editorPinBtn" title="Pin note">
          <svg viewBox="0 0 24 24"><path d="M12 2l1.8 5.6L19 9l-4 3.6.9 6.4L12 16l-3.9 3 .9-6.4L5 9l5.2-1.4z"/></svg>
        </button>
        <button class="icon-btn popover-trigger" id="editorColorBtn" title="Background options">
          <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 100 20c1.5 0 2-1 2-2s-.5-1.5-.5-2 .5-1 1.5-1h1a5 5 0 005-5c0-5.5-4.5-10-9-10z"/><circle cx="7.5" cy="10.5" r="1.2"/><circle cx="12" cy="7.5" r="1.2"/><circle cx="16.5" cy="10.5" r="1.2"/></svg>
        </button>
        <button class="icon-btn popover-trigger" id="editorLabelBtn" title="Add label">
          <svg viewBox="0 0 24 24"><path d="M20.6 12.6L12 21.2 2.8 12 11.4 3.4 20.6 12.6z"/><circle cx="8.5" cy="8.5" r="1.3"/></svg>
        </button>
        <button class="icon-btn" id="editorArchiveBtn" title="Archive">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v11a1 1 0 001 1h12a1 1 0 001-1V8"/><path d="M10 13h4"/></svg>
        </button>
        <button class="icon-btn popover-trigger" id="editorMoreBtn" title="More">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg>
        </button>
      </div>
      <button class="text-btn" id="editorCloseBtn">Close</button>
    </div>
  </div>
</div>

<!-- Reusable popovers -->
<div class="popover hidden" id="colorPopover">
  <div class="color-grid" id="colorGrid"></div>
</div>

<div class="popover hidden" id="morePopover">
  <button class="popover-item" id="moreDeleteBtn">Delete note</button>
  <button class="popover-item" id="moreCopyBtn">Make a copy</button>
  <button class="popover-item" id="moreConvertBtn">Convert to checklist</button>
</div>

<div class="popover hidden" id="labelPopover">
  <div id="labelPopoverList" class="label-popover-list"></div>
  <div class="label-popover-create">
    <input type="text" id="labelPopoverInput" placeholder="Create new label">
    <button class="icon-btn tiny" id="labelPopoverAddBtn">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>
</div>

<div class="toast hidden" id="toast"></div>

<!-- Compatibility shim, hidden via CSS. A browser holding a cached app.js from
     2026-08-03.5 or earlier looks this element up and writes to it without a
     null check, on the second line of init() — before applyTheme(). With the
     element gone that throws, no data-theme is ever set, and the app silently
     falls back to the light palette. Keeping an empty hidden node costs
     nothing and makes a stale app.js harmless. Safe to delete once no client
     can still be running .5. -->
<div id="buildBadge" class="build-badge"></div>
<script src="/js/vendor/Sortable.min.js"></script>
<script src="/js/db.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
